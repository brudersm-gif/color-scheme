<!DOCTYPE html>
<html>
<head>
	<title>Color Scheme Assignment</title>
</head>
<body>
	<table>
	<style>
		table, tr, td {
			border: 1px solid black;
		}
	</style>
		<th style="font-weight: bold; font-family: 'Georgia', serif;" colspan="4">Ocean Sunset</th>
		<tr>
			<td style="background-color: hsl(260, 80%, 40%, 0.90); color: white;">dark blue</td>
			<td style="background-color: hsl(340, 70%, 50%, 0.90);">pink</td>
			<td style="background-color: hsl(30, 70%, 50%, 0.90);">orange</td>
			<td style="background-color: hsl(60, 70%, 50%, 0.90);">yellow</td>
		</tr>
		<tr>
			<td>#4F00F0</td>
			<td>#FF0A93</td>
			<td>#EC7E20</td>
			<td>#ECCE20</td>
		</tr>
		<tr>
			<td>rgb(75, 0, 255, 0.90);</td>
			<td>rgb(245, 0, 164, 0.90);</td>
			<td>rgb(190, 85, 0, 0.90);</td>
			<td>rgb(235, 255, 0, 0.70);</td>
		</tr>
		<tr>
			<td>hsl(260, 80%, 40%, 0.90);</td>
			<td>hsl(340, 70%, 50%, 0.90);</td>
			<td>hsl(30, 70%, 50%, 0.90);</td>
			<td>hsl(60, 70%, 50%, 0.90);</td>		
		</tr>
	</table>
</body>
</html>
